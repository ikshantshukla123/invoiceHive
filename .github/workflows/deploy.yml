name: Deploy to EC2

# ── Only runs on merge to main (after CI passes) ─────────────────────────────
on:
  push:
    branches: [main]

# ── Prevent concurrent deploys ────────────────────────────────────────────────
concurrency:
  group: production-deploy
  cancel-in-progress: false  # Never cancel a running deploy — finish it first

jobs:
  # ── Deploy to EC2 ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval if configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Copy docker-compose.yml to EC2 ───────────────────────────────────────
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.yml,.env.example"
          target:   "/home/${{ secrets.EC2_USER }}/invoicehive"

      # ── SSH into EC2 and deploy ────────────────────────────────────────────
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e  # Exit on any error

            cd /home/${{ secrets.EC2_USER }}/invoicehive

            # ── Create/update .env with all environment variables ─────
            cat > .env <<EOF
            # ── Deployment Configuration ──────────────────────────────
            NODE_ENV=production
            CLIENT_URL=https://${{ secrets.APP_DOMAIN }}
            API_URL=https://${{ secrets.API_DOMAIN }}
            SERVER_NAME=${{ secrets.API_DOMAIN }} ${{ secrets.APP_DOMAIN }}
            ALLOWED_ORIGIN_1=https://${{ secrets.APP_DOMAIN }}
            ALLOWED_ORIGIN_2=https://www.${{ secrets.APP_DOMAIN }}
            ALLOWED_ORIGIN_3=https://${{ secrets.API_DOMAIN }}

            # ── Database & Cache (Cloud Services) ──────────────────────
            MONGO_URI=${{ secrets.MONGO_URI }}
            REDIS_URL=${{ secrets.REDIS_URL }}

            # ── JWT & Authentication ──────────────────────────────────
            JWT_ACCESS_EXPIRES_IN=15m
            JWT_REFRESH_EXPIRES_IN=7d
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}

            # ── Service-to-Service Communication ──────────────────────
            INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}

            # ── OAuth - Google ──────────────────────────────────────
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=https://${{ secrets.API_DOMAIN }}/api/auth/oauth/google/callback

            # ── OAuth - GitHub ──────────────────────────────────────
            HUB_CLIENT_ID=${{ secrets.HUB_CLIENT_ID }}
            HUB_CLIENT_SECRET=${{ secrets.HUB_CLIENT_SECRET }}
            HUB_CALLBACK_URL=https://${{ secrets.API_DOMAIN }}/api/auth/oauth/github/callback

            # ── Email (SMTP) ────────────────────────────────────────
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}

            # ── AWS S3 (Object Storage) ──────────────────────────────
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            STORAGE_PUBLIC_URL=${{ secrets.STORAGE_PUBLIC_URL }}

            # ── RabbitMQ ─────────────────────────────────────────────
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}

            # ── Razorpay (Payment Gateway) ───────────────────────────
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
            EOF

            echo "✓ .env file created with all secrets"

            echo "🔄 Pulling git updates..."
            git pull origin main

            echo "🛑 Stopping old services..."
            docker compose down 2>/dev/null || true

            echo "🏗️ Building images and starting services..."
            docker compose up -d --build

            echo "⏳ Waiting for services to initialize..."
            sleep 30

            echo "🏥 Checking service status..."
            docker compose ps

            echo "🧹 Cleaning up old images..."
            docker image prune -f --force

            echo "✅ Deploy complete!"

      # ── Post-deploy health check ───────────────────────────────────────────
      - name: Verify deployment
        run: |
          # Wait for nginx to be ready
          sleep 10

          # Check the gateway health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}/health)

          if [ "$response" = "200" ]; then
            echo "Gateway is healthy (HTTP $response)"
          else
            echo "Gateway health check failed (HTTP $response)"
            exit 1
          fi

      # ── Notify on failure ──────────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy failed for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
