services:

  # API gateway
  nginx:
    build: ./gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - SERVER_NAME=${SERVER_NAME:-api.ikshant.me ikshant.me}
      - ALLOWED_ORIGIN_1=${ALLOWED_ORIGIN_1:-https://ikshant.me}
      - ALLOWED_ORIGIN_2=${ALLOWED_ORIGIN_2:-https://www.ikshant.me}
      - ALLOWED_ORIGIN_3=${ALLOWED_ORIGIN_3:-https://api.ikshant.me}
    depends_on:
      - auth-service
      - client-service
      - invoice-service
      - payment-service
    restart: always
    networks:
      - invoicehive_net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_URL=https://api.ikshant.me/api
      - NODE_ENV=production
    expose:
      - "3000"
    restart: always
    networks:
      - invoicehive_net

  auth-service:
    build:
      context: ./auth-service
    working_dir: /app
    env_file: ./auth-service/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - HUB_CLIENT_ID=${HUB_CLIENT_ID}
      - HUB_CLIENT_SECRET=${HUB_CLIENT_SECRET}
      - HUB_CALLBACK_URL=${HUB_CALLBACK_URL}
    restart: always
    networks:
      - invoicehive_net

  client-service:
    build:
      context: ./client-service
    working_dir: /app
    env_file: ./client-service/.env
    environment:
      - PORT=3002
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    restart: always
    networks:
      - invoicehive_net

  invoice-service:
    build:
      context: ./invoice-service
    working_dir: /app
    env_file: ./invoice-service/.env
    environment:
      - PORT=3003
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - CLIENT_SERVICE_URL=http://client-service:3002
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    restart: always
    networks:
      - invoicehive_net

  payment-service:
    build:
      context: ./payment-service
    working_dir: /app
    env_file: ./payment-service/.env
    environment:
      - PORT=3004
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INVOICE_SERVICE_URL=http://invoice-service:3003
    restart: always
    networks:
      - invoicehive_net

  notification-service:
    build:
      context: ./notification-service
    working_dir: /app
    env_file: ./notification-service/.env
    environment:
      - PORT=3005
      - NODE_ENV=production
      - API_URL=${API_URL}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
    restart: always
    networks:
      - invoicehive_net

  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    restart: always
    networks:
      - invoicehive_net

networks:
  invoicehive_net:
    driver: bridge

volumes:
  client_node_modules:
  auth_node_modules:
  client_svc_node_modules:
  invoice_node_modules:
  payment_node_modules:
  notification_node_modules:
